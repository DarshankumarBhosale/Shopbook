name: Build debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        id: gradle
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Publish APK and build log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          FILES="build.log"
          if [ -f "$APK" ]; then
            cp "$APK" shopbook-debug.apk
            FILES="$FILES shopbook-debug.apk"
          fi
          gh release delete ci-latest --yes --cleanup-tag || true
          gh release create ci-latest $FILES \
            --title "Latest CI build" \
            --notes "Automated build of ${{ github.sha }}. Install shopbook-debug.apk on your phone." \
            --prerelease

      # Release assets on a private repo need an API token to download. The APK
      # is also force-pushed to a single-commit `apk` branch so it can be pulled
      # with ordinary git access. The branch is recreated from scratch each run,
      # so build artefacts never accumulate in history.
      - name: Publish APK to the apk branch
        if: success()
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          [ -f "$APK" ] || exit 0
          WORK=$(mktemp -d)
          cp "$APK" "$WORK/shopbook-debug.apk"
          cd "$WORK"
          echo "Debug APK built from ${{ github.sha }}." > README.md
          git init -q
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -q -b apk
          git add -A
          git commit -q -m "APK for ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
